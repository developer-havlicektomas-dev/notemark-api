spring.application.name=notemark-api

# Server binds to all interfaces (0.0.0.0) by default so the mobile app can reach it
# from an Android emulator (http://10.0.2.2:8080) or a physical device on the same
# Wi-Fi (http://<host-LAN-IP>:8080).
server.port=8080

# --- JWT configuration ---
# HS256 signing secret. Base64-encoded, must decode to >= 32 bytes for HS256.
jwt.secret=bm90ZW1hcmstbG9jYWwtZGV2LXNlY3JldC1rZXktY2hhbmdlLW1lLTEyMzQ1Ng==
# Access token lifetimes (ISO-8601 / Spring duration syntax).
jwt.access-validity=15m
# Lifetime when the request carries header `Debug: true`.
jwt.access-debug-validity=30s
# Refresh token lifetime.
jwt.refresh-validity=30d
